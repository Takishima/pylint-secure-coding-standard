---

name: "Draft new release"

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release (e.g. v1.2.3; the leading "v" is optional)'
        required: true

permissions:
  contents: write  # required to push the release branch
  pull-requests: write  # required to open the release pull request

jobs:
  new-release:
    name: "Draft a new release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # Accept 1.2.3, v1.2.3 and V1.2.3 (optionally with a pre-release suffix such as -rc.1)
          version="${INPUT_TAG#[vV]}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::'${INPUT_TAG}' is not a valid version (expected vX.Y.Z or vX.Y.Z-rc.N)"
              exit 1
          fi
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "::error::Tag ${tag} already exists"
              exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/release/${tag}" > /dev/null; then
              echo "::error::Branch release/${tag} already exists"
              exit 1
          fi

          # Refuse to create a release without any CHANGELOG entry
          unreleased=$(awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{found=0} found' CHANGELOG.md)
          if [[ -z "${unreleased//[[:space:]]/}" ]]; then
              echo "::error::The [Unreleased] section of CHANGELOG.md is empty: nothing to release"
              exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/setup.cfg'

      - name: Update CHANGELOG
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 -m pip install mdformat-gfm 'git+https://github.com/Takishima/keepachangelog@v1.0.1'
          python3 -m keepachangelog release "${RELEASE_TAG}"
          python3 -m mdformat CHANGELOG.md

      - name: Push release branch
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/${RELEASE_TAG}"
          git commit -m "Preparing release ${RELEASE_TAG}" CHANGELOG.md
          git push origin "release/${RELEASE_TAG}"

      # yamllint disable rule:line-length
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "${RUNNER_TEMP}/pr_body.md" << EOF
          Hi @${GITHUB_ACTOR}!

          This PR was created in response to a manual trigger of the release workflow here: ${RUN_URL}.

          I've moved the unreleased entries of the CHANGELOG to a new \`${RELEASE_TAG}\` section in $(git rev-parse HEAD).
          The package version itself is derived from the Git tag, so there is nothing else to update.

          Merging this PR will build the package, upload it to PyPI and then create the \`${RELEASE_TAG}\` tag and GitHub release.
          EOF

          gh pr create \
            --base main \
            --head "release/${RELEASE_TAG}" \
            --title "Release version ${RELEASE_TAG}" \
            --body-file "${RUNNER_TEMP}/pr_body.md" \
            --reviewer "${GITHUB_ACTOR}"

---

name: CI

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
      - develop
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standard:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
        python:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'

    name: "🐍 ${{ matrix.python }} • ${{ matrix.runs-on }}"
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags are required for SCM versioning to work
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: '**/setup.cfg'

      - name: Setup annotations on Linux
        if: runner.os == 'Linux'
        run: python -m pip install pytest-github-actions-annotate-failures

      - name: Build and install package
        run: python -m pip install -e .[test]

      - name: Run tests
        run: python -m pytest -v --cov=pylint_secure_coding_standard --cov-report=term --cov-report=lcov:coverage.lcov

      - name: Coveralls.io
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          format: lcov
          flag-name: python-${{ matrix.python }}-${{ matrix.runs-on }}
          parallel: true

  finish:
    needs: standard
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
